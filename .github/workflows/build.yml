name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto Create Missing Android Files
      run: |
        mkdir -p app/src/main/java/com/example/aividapp
        echo "package com.example.aividapp" > app/src/main/java/com/example/aividapp/MainActivity.kt
        echo "import android.os.Bundle" >> app/src/main/java/com/example/aividapp/MainActivity.kt
        echo "import androidx.activity.ComponentActivity" >> app/src/main/java/com/example/aividapp/MainActivity.kt
        echo "import androidx.activity.compose.setContent" >> app/src/main/java/com/example/aividapp/MainActivity.kt
        echo "import androidx.compose.material3.Text" >> app/src/main/java/com/example/aividapp/MainActivity.kt
        echo "class MainActivity : ComponentActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { Text(\"AI Video Generator App\") } } }" >> app/src/main/java/com/example/aividapp/MainActivity.kt
        
        mkdir -p app/src/main
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.aividapp"><uses-permission android:name="android.permission.INTERNET" /><application android:allowBackup="true" android:label="AI Video App"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Video-App
        path: app/build/outputs/apk/debug/app-debug.apk
